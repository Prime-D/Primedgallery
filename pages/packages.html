<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prime-D | Select Package</title>
    <link rel="stylesheet" href="../css/style.css?v=1.6">
    <style>
        /* ==========================================
            LUXURY LIGHT BACKGROUND & ORIGINAL BOXES THEME
            ========================================== */
        body {
            background: #fbf9f6 !important; 
            color: #222222 !important;    
        }

        /* LIGHT NAVIGATION */
        .navbar {
            background: rgba(255, 255, 255, 0.95) !important;
            border-bottom: 1px solid #e6dec9 !important;
        }

        .navbar nav a {
            color: #333333 !important;
        }

        .navbar nav a:hover {
            color: #c5a059 !important;
        }

        /* CATEGORY BANNER */
        .category-banner {
            background-color: #1a1816 !important; 
        }

        /* PACKAGES SECTION BACKGROUND (Full Image Without White Overlay) */
        .lux-light-section {
            background-color: #121212 !important;
            background-size: cover !important;
            background-position: center !important;
            background-repeat: no-repeat !important;
            position: relative;
            border-top: 1px solid #e3dbc9;
            border-bottom: 1px solid #e3dbc9;
        }

        .packages-grid, .lux-light-section > div {
            position: relative;
            z-index: 2;
        }

        /* ORIGINAL DARK BOXES / CARDS STYLE */
        .package-card-item {
            background: linear-gradient(145deg, rgba(28, 26, 23, 0.95), rgba(18, 17, 16, 0.98)) !important;
            border: 1px solid rgba(212, 175, 55, 0.3) !important;
            border-radius: 4px !important;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4) !important;
            transition: all 0.4s ease !important;
        }

        .package-card-item:hover {
            transform: translateY(-8px) !important;
            border-color: #d4af37 !important;
            box-shadow: 0 20px 45px rgba(212, 175, 55, 0.2) !important;
        }

        /* BACK BUTTON */
        .primary-button {
            background: linear-gradient(135deg, #f3e5ad 0%, #c5a059 50%, #9e7b32 100%) !important;
            color: #121110 !important;
        }

        .primary-button:hover {
            background: #1a1816 !important;
            color: #ffffff !important;
        }

        /* FOOTER */
        footer {
            background: #1a1816 !important;
            color: #a49c91 !important;
            border-top: 1px solid #2a2825 !important;
        }
    </style>
</head>
<body>

    <!-- NAVIGATION -->
    <header class="navbar">
        <div class="logo">PRIME-D</div>
        <nav>
            <a href="../index.html">Home</a>
            <a href="../index.html#events">Events</a>
            <a href="../index.html#services">Services</a>
            <a href="../index.html#about">About</a>
            <a href="../index.html#contact">Contact</a>
        </nav>
    </header>

    <!-- CATEGORY BANNER SECTION -->
    <div class="category-banner" id="categoryBanner" style="width: 100%; height: 350px; background-size: cover; background-position: center; position: relative; display: flex; align-items: center; justify-content: center; background-color: #121212; background-image: linear-gradient(135deg, rgba(18,18,18,0.5), rgba(18,18,18,0.7)), url('../images/hero.jpg');">
        <div style="text-align: center; position: relative; z-index: 2; padding: 0 20px;">
            <p class="section-label" id="catLabel" style="color: var(--gold); letter-spacing: 4px; margin-bottom: 10px;">PACKAGES</p>
            <h2 id="catTitle" style="font-family: 'Cormorant Garamond', Georgia, serif; font-size: clamp(35px, 5vw, 55px); color: #ffffff; font-weight: 300; margin: 0;">Choose a Package</h2>
            <p style="color: #e0d5c1; margin-top: 10px; font-size: 15px;">Select a package to view the full service checklist.</p>
        </div>
    </div>

    <!-- PACKAGES SECTION -->
    <section class="services-section lux-light-section" id="luxSection" style="min-height: 50vh; padding: 90px 8%;">
        <!-- Packages Grid Container -->
        <div class="packages-grid" id="packagesGrid" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 35px; max-width: 1100px; margin: 0 auto;">
            <div style="color: #776e62; text-align: center; grid-column: 1/-1;">Loading packages...</div>
        </div>

        <!-- Back Button -->
        <div style="text-align: center; margin-top: 60px;">
            <a href="../index.html#services" class="primary-button">← Back to Services</a>
        </div>
    </section>

    <!-- FOOTER -->
    <footer>
        <p>© 2026 Prime-D Event Planning & Decorations. All Rights Reserved.</p>
    </footer>

    <!-- SCRIPT TO LOAD PACKAGES FROM SUPABASE -->
    <script type="module">
        import { supabase } from "../js/supabase.js";

        const urlParams = new URLSearchParams(window.location.search);
        const categorySlug = urlParams.get("category");

        const catTitle = document.getElementById("catTitle");
        const catLabel = document.getElementById("catLabel");
        const categoryBanner = document.getElementById("categoryBanner");
        const packagesGrid = document.getElementById("packagesGrid");
        const luxSection = document.getElementById("luxSection");

        async function loadPackages() {
            if (!categorySlug) {
                packagesGrid.innerHTML = `<div style="color: #776e62; text-align: center; grid-column: 1/-1;">No category specified.</div>`;
                return;
            }

            // 1. Fetch Category Details including bg_image
            const { data: catData, error: catError } = await supabase
                .from("service_categories")
                .select("name, slug, image_url, bg_image")
                .eq("slug", categorySlug)
                .single();

            if (catError || !catData) {
                packagesGrid.innerHTML = `<div style="color: #776e62; text-align: center; grid-column: 1/-1;">Category not found.</div>`;
                return;
            }

            if (catData) {
                catLabel.textContent = `${catData.name.toUpperCase()} PACKAGES`;
                catTitle.textContent = `${catData.name} Packages`;
                
                if (catData.image_url) {
                    categoryBanner.style.backgroundImage = `linear-gradient(135deg, rgba(18,18,18,0.5), rgba(18,18,18,0.7)), url('${catData.image_url}')`;
                }

                // Apply full background image without white overlay (using a subtle dark overlay so white text remains readable)
                if (catData.bg_image && catData.bg_image.trim() !== "") {
                    if (luxSection) {
                        luxSection.style.backgroundImage = `linear-gradient(rgba(18, 18, 18, 0.6), rgba(18, 18, 18, 0.6)), url('${catData.bg_image}')`;
                    }
                }
            }

            // 2. Fetch Packages from the independent 'packages' table using category_slug
            const { data: packages, error } = await supabase
                .from("packages")
                .select("*")
                .eq("category_slug", categorySlug);

            if (error || !packages || packages.length === 0) {
                packagesGrid.innerHTML = `<div style="color: #776e62; text-align: center; grid-column: 1/-1;">No packages found for this category yet. Please add them via Admin Panel.</div>`;
                return;
            }

            packagesGrid.innerHTML = "";
            packages.forEach(pkg => {
                const card = document.createElement("a");
                card.href = `services.html?category=${categorySlug}&package_id=${pkg.id}`;
                card.className = "service-cat-card package-card-item";
                card.style.cssText = "border-radius: 4px; padding: 30px; display: flex; flex-direction: column; gap: 15px; text-decoration: none; overflow: hidden;";
                
                let imageHtml = "";
                if (pkg.image_url) {
                    imageHtml = `
                        <div style="width: 100%; height: 200px; overflow: hidden; margin-bottom: 10px; border-radius: 2px;">
                            <img src="${pkg.image_url}" alt="${pkg.package_name}" style="width: 100%; height: 100%; object-fit: cover; transition: 0.5s ease;">
                        </div>
                    `;
                } else {
                    imageHtml = `<span style="font-size: 32px;">📦</span>`;
                }

                card.innerHTML = `
                    ${imageHtml}
                    <h3 style="font-family: 'Cormorant Garamond', Georgia, serif; font-size: 26px; color: #ffffff; margin: 0;">${pkg.package_name}</h3>
                    <p style="color: #a49c91; font-size: 14px; margin: 0; line-height: 1.6;">${pkg.description || 'Explore the complete checklist included in this package.'}</p>
                    <span style="margin-top: auto; padding-top: 15px; color: var(--gold); font-size: 12px; font-weight: 600; letter-spacing: 2px; text-transform: uppercase;">View Checklist →</span>
                `;
                packagesGrid.appendChild(card);
            });
        }

        loadPackages();
    </script>
</body>
</html>
