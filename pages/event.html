<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Details | Prime-D</title>
    <link rel="stylesheet" href="../css/style.css">
    <style>
        /* BASE CSS VARIABLES */
        :root {
            --bg-dark: #121212;
            --card-bg: #1e1e1e;
            --accent-gold: #c5a059;
            --text-light: #f5f5f5;
            --text-muted: #a0a0a0;
            --border-color: #2a2a2a;
            --hero-bg: linear-gradient(180deg, #181818 0%, #121212 100%);
        }

        /* LIGHT THEME OVERRIDES */
        body.light-theme {
            --bg-dark: #f5f0e6 !important;
            --card-bg: #ffffff !important;
            --accent-gold: #9e7b32 !important;
            --text-light: #121110 !important;
            --text-muted: #615a51 !important;
            --border-color: #e3dbc9 !important;
            --hero-bg: linear-gradient(180deg, #eae3d2 0%, #f5f0e6 100%) !important;
        }

        body {
            background-color: var(--bg-dark) !important;
            color: var(--text-light) !important;
            font-family: 'Plus Jakarta Sans', Arial, sans-serif;
            margin: 0;
            padding: 0;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        /* LIGHT MODE TARGETING FIXES */
        body.light-theme .event-nav {
            background: rgba(245, 240, 230, 0.95) !important;
        }

        body.light-theme .media-item-card {
            background: #ffffff !important;
            border-color: #e3dbc9 !important;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
        }

        body.light-theme .filter-btn {
            background: #ffffff !important;
            color: #121110 !important;
            border-color: #e3dbc9 !important;
        }

        body.light-theme .filter-btn.active {
            background: #9e7b32 !important;
            color: #ffffff !important;
            border-color: #9e7b32 !important;
        }

        /* HEADER & NAVIGATION */
        .event-nav {
            display: flex !important;
            justify-content: space-between !important;
            align-items: center !important;
            padding: 15px 8% !important;
            background: var(--bg-dark);
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 1000;
            transition: background 0.3s ease;
        }

        .brand-logo {
            font-size: 22px;
            font-weight: 700;
            letter-spacing: 2px;
            color: var(--accent-gold);
            text-decoration: none;
        }

        .nav-actions {
            display: flex !important;
            align-items: center !important;
            gap: 12px !important;
        }

        /* ALWAYS VISIBLE THEME TOGGLE BUTTON */
        .theme-toggle-btn {
            display: inline-flex !important;
            align-items: center !important;
            justify-content: center !important;
            gap: 6px !important;
            background: var(--card-bg) !important;
            color: var(--text-light) !important;
            border: 1px solid var(--accent-gold) !important;
            padding: 8px 16px !important;
            border-radius: 20px !important;
            cursor: pointer !important;
            font-size: 13px !important;
            font-weight: 600 !important;
            z-index: 1001 !important;
            transition: all 0.3s ease;
        }

        .theme-toggle-btn:hover {
            background: var(--accent-gold) !important;
            color: #121110 !important;
        }

        /* HERO SECTION WITH CLEAR VISIBLE BACKGROUND PHOTO */
        header.event-hero#eventHero {
            position: relative;
            padding: 80px 8% 70px;
            background-color: var(--bg-dark);
            background-size: cover !important;
            background-position: center center !important;
            background-repeat: no-repeat !important;
            filter: saturate(1.25) contrast(1.1);
            border-bottom: 1px solid var(--border-color);
            transition: background 0.4s ease;
            overflow: hidden;
        }

        /* LIGHT OVERLAY FOR MAXIMUM PHOTO VISIBILITY */
        header.event-hero#eventHero::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(180deg, rgba(0, 0, 0, 0.15) 0%, rgba(0, 0, 0, 0.35) 100%);
            z-index: 1;
        }

        body.light-theme header.event-hero#eventHero::before {
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.20) 0%, rgba(255, 255, 255, 0.40) 100%);
        }

        /* CLASSY HERO CONTENT CARD BOX (GLASSMORPHISM EFFECT) */
        .hero-content-box {
            position: relative;
            z-index: 2;
            max-width: 820px;
            background: rgba(18, 18, 18, 0.65);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            padding: 35px 40px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            border-left: 5px solid var(--accent-gold);
            transition: all 0.3s ease;
        }

        body.light-theme .hero-content-box {
            background: rgba(255, 255, 255, 0.82);
            border: 1px solid rgba(0, 0, 0, 0.08);
            border-left: 5px solid var(--accent-gold);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.08);
        }

        .event-tag {
            color: var(--accent-gold);
            font-size: 12px;
            letter-spacing: 3px;
            text-transform: uppercase;
            font-weight: 700;
            margin-bottom: 12px;
            display: inline-block;
        }

        .event-title-main {
            font-size: 42px;
            font-weight: 800;
            margin: 0 0 16px 0;
            line-height: 1.25;
            color: #ffffff;
            letter-spacing: -0.5px;
        }

        body.light-theme .event-title-main {
            color: #121110;
        }

        .event-meta-info {
            display: flex;
            gap: 20px;
            color: var(--accent-gold);
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .event-meta-info span {
            background: rgba(197, 160, 89, 0.12);
            padding: 6px 14px;
            border-radius: 20px;
            border: 1px solid rgba(197, 160, 89, 0.25);
        }

        .event-description-box {
            line-height: 1.8;
            color: #e0e0e0;
            font-size: 16px;
            margin: 0;
        }

        body.light-theme .event-description-box {
            color: #33302c;
        }

        /* CATEGORY FILTER TABS */
        .gallery-container {
            padding: 40px 8% 40px;
        }

        .category-filter-bar {
            display: flex;
            gap: 12px;
            margin-bottom: 35px;
            flex-wrap: wrap;
        }

        .filter-btn {
            background: var(--card-bg);
            color: var(--text-light);
            border: 1px solid var(--border-color);
            padding: 10px 20px;
            border-radius: 30px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .filter-btn:hover, .filter-btn.active {
            background: var(--accent-gold);
            color: #ffffff;
            border-color: var(--accent-gold);
            font-weight: 600;
        }

        /* MEDIA GRID */
        .section-heading {
            font-size: 20px;
            letter-spacing: 1px;
            margin-bottom: 20px;
            color: var(--accent-gold);
            text-transform: uppercase;
        }

        .media-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 50px;
        }

        .media-item-card {
            background: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--border-color);
            transition: transform 0.3s ease, box-shadow 0.3s ease, background 0.3s ease;
            position: relative;
            cursor: pointer;
        }

        .media-item-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
        }

        .media-item-card img, .media-item-card video {
            width: 100%;
            height: 240px;
            object-fit: cover;
            display: block;
        }

        .video-card-badge {
            position: absolute;
            top: 12px;
            right: 12px;
            background: rgba(0, 0, 0, 0.7);
            color: #fff;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 12px;
        }

        .empty-gallery-msg {
            color: var(--text-muted);
            text-align: center;
            padding: 50px;
            background: var(--card-bg);
            border-radius: 10px;
            grid-column: 1 / -1;
            border: 1px solid var(--border-color);
        }

        /* BUTTON STYLES */
        .back-home-btn {
            display: inline-block;
            background: linear-gradient(135deg, #f3e5ad 0%, #c5a059 50%, #9e7b32 100%);
            color: #121110 !important;
            font-weight: 600;
            padding: 8px 18px;
            border-radius: 4px;
            text-decoration: none;
            font-size: 13px;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(197, 160, 89, 0.2);
            white-space: nowrap;
        }

        .back-home-btn:hover {
            background: #ffffff;
            color: #121110 !important;
            transform: translateX(-3px);
            box-shadow: 0 6px 20px rgba(255, 255, 255, 0.3);
        }

        /* BOTTOM BACK TO HOME BUTTON */
        .bottom-back-container {
            text-align: center;
            padding: 20px 20px 80px;
            background: var(--bg-dark);
            transition: background 0.3s ease;
        }

        .bottom-back-btn {
            display: inline-block;
            padding: 14px 32px;
            background: linear-gradient(135deg, #f3e5ad 0%, #c5a059 50%, #9e7b32 100%);
            color: #121110 !important;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
            text-decoration: none;
            border-radius: 4px;
            transition: all 0.3s ease;
            box-shadow: 0 10px 25px rgba(197, 160, 89, 0.2);
        }

        .bottom-back-btn:hover {
            background: #ffffff;
            color: #121110 !important;
            transform: translateY(-3px);
            box-shadow: 0 15px 30px rgba(255, 255, 255, 0.3);
        }

        @media (max-width: 768px) {
            .event-title-main { font-size: 28px; }
            .hero-content-box { padding: 25px 20px; }
            .media-grid { grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); }
            .event-nav { padding: 12px 15px !important; }
            .theme-toggle-btn { padding: 6px 12px !important; font-size: 12px !important; }
            .back-home-btn { padding: 6px 12px !important; font-size: 11px !important; }
            header.event-hero#eventHero { padding: 40px 4% 40px; }
        }
    </style>
</head>
<body>

    <!-- NAVIGATION WITH BACK & THEME TOGGLE BUTTON -->
    <nav class="event-nav" id="eventNav">
        <a href="../index.html" class="brand-logo">PRIME-D</a>
        
        <div class="nav-actions">
            <!-- THEME SWITCHER BUTTON -->
            <button type="button" class="theme-toggle-btn" id="themeToggleBtn">
                <span id="themeIcon">☀️</span> <span id="themeText">Light</span>
            </button>
            <a href="../index.html" class="back-home-btn">← Back to Home</a>
        </div>
    </nav>

    <!-- CLASSY HERO HEADER SECTION WITH GLASS BOX -->
    <header class="event-hero" id="eventHero">
        <div class="hero-content-box">
            <div class="event-tag">PRIME-D EXCLUSIVE EVENT</div>
            <h1 class="event-title-main" id="eventTitle">Loading Event...</h1>
            
            <div class="event-meta-info">
                <span id="eventDate">📅 Date...</span>
                <span id="eventLocation">📍 Location...</span>
                <span id="eventBudget" style="display: none;">💰 Budget...</span>
            </div>

            <div class="event-description-box" id="eventDescription">
                Loading event story details...
            </div>
        </div>
    </header>

    <main class="gallery-container">
        <!-- CATEGORIES -->
        <div class="category-filter-bar" id="categoryFilterBar">
            <button class="filter-btn active" data-category="all">All Media</button>
        </div>

        <!-- PHOTOS GRID -->
        <h2 class="section-heading">📷 Moments & Photos</h2>
        <div class="media-grid" id="photosGrid">
            <div class="empty-gallery-msg">Loading photos...</div>
        </div>

        <!-- VIDEOS GRID -->
        <h2 class="section-heading">🎥 Film & Videos</h2>
        <div class="media-grid" id="videosGrid">
            <div class="empty-gallery-msg">Loading videos...</div>
        </div>
    </main>

    <!-- BOTTOM BACK TO HOME BUTTON -->
    <div class="bottom-back-container">
        <a href="../index.html" class="bottom-back-btn">
            ← Back to All Events
        </a>
    </div>

    <!-- THEME TOGGLE SCRIPT -->
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const themeBtn = document.getElementById("themeToggleBtn");
            const themeIcon = document.getElementById("themeIcon");
            const themeText = document.getElementById("themeText");

            // Previous Theme Preference Setup
            const savedTheme = localStorage.getItem("primed_theme");
            if (savedTheme === "light") {
                document.body.classList.add("light-theme");
                if (themeIcon) themeIcon.textContent = "🌙";
                if (themeText) themeText.textContent = "Dark";
            }

            themeBtn?.addEventListener("click", () => {
                document.body.classList.toggle("light-theme");
                const isLight = document.body.classList.contains("light-theme");

                if (isLight) {
                    if (themeIcon) themeIcon.textContent = "🌙";
                    if (themeText) themeText.textContent = "Dark";
                    localStorage.setItem("primed_theme", "light");
                } else {
                    if (themeIcon) themeIcon.textContent = "☀️";
                    if (themeText) themeText.textContent = "Light";
                    localStorage.setItem("primed_theme", "dark");
                }
            });
        });
    </script>

    <script type="module" src="../js/event.js"></script>
</body>
</html>
