<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Details | Prime-D</title>
    <link rel="stylesheet" href="../css/style.css">
    <style>
        /* CSS VARIABLES FOR THEME SWITCHING */
        :root {
            --bg-dark: #121212;
            --card-bg: #1e1e1e;
            --accent-gold: #c5a059;
            --text-light: #f5f5f5;
            --text-muted: #a0a0a0;
            --border-color: #2a2a2a;
            --hero-bg: linear-gradient(180deg, #181818 0%, #121212 100%);
        }

        /* LIGHT THEME OVERRIDES (STRICT OVERRIDE FIX) */
        body.light-theme {
            --bg-dark: #f5f0e6 !important;
            --card-bg: #ffffff !important;
            --accent-gold: #9e7b32 !important;
            --text-light: #121110 !important;
            --text-muted: #615a51 !important;
            --border-color: #e3dbc9 !important;
            --hero-bg: linear-gradient(180deg, #eae3d2 0%, #f5f0e6 100%) !important;
        }

        body {
            background-color: var(--bg-dark) !important;
            color: var(--text-light) !important;
            font-family: 'Plus Jakarta Sans', sans-serif;
            margin: 0;
            padding: 0;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        /* LIGHT MODE SPECIFIC TARGETING FIXES */
        body.light-theme .event-nav {
            background: rgba(245, 240, 230, 0.95) !important;
        }

        body.light-theme .event-description-box {
            background: #ffffff !important;
            color: #121110 !important;
            border: 1px solid #e3dbc9 !important;
            border-left: 4px solid #9e7b32 !important;
        }

        body.light-theme .media-item-card {
            background: #ffffff !important;
            border-color: #e3dbc9 !important;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
        }

        body.light-theme .filter-btn {
            background: #ffffff !important;
            color: #121110 !important;
            border-color: #e3dbc9 !important;
        }

        body.light-theme .filter-btn.active {
            background: #9e7b32 !important;
            color: #ffffff !important;
            border-color: #9e7b32 !important;
        }

        /* HEADER & NAVIGATION */
        .event-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 8%;
            background: var(--bg-dark);
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 100;
            transition: background 0.3s ease;
        }

        .brand-logo {
            font-size: 22px;
            font-weight: 700;
            letter-spacing: 2px;
            color: var(--accent-gold);
            text-decoration: none;
        }

        .nav-actions {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        /* THEME TOGGLE BUTTON */
        .theme-toggle-btn {
            background: var(--card-bg);
            color: var(--text-light);
            border: 1px solid var(--border-color);
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.3s ease;
        }

        .theme-toggle-btn:hover {
            border-color: var(--accent-gold);
            color: var(--accent-gold);
        }

        /* HERO / HEADER SECTION */
        .event-hero {
            padding: 60px 8% 40px;
            background: var(--hero-bg);
            border-bottom: 1px solid var(--border-color);
            transition: background 0.3s ease;
        }

        .event-tag {
            color: var(--accent-gold);
            font-size: 12px;
            letter-spacing: 3px;
            text-transform: uppercase;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .event-title-main {
            font-size: 42px;
            font-weight: 700;
            margin: 0 0 15px 0;
            line-height: 1.2;
            color: var(--text-light);
        }

        .event-meta-info {
            display: flex;
            gap: 25px;
            color: var(--text-muted);
            font-size: 15px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }

        .event-description-box {
            max-width: 800px;
            line-height: 1.7;
            color: var(--text-light);
            font-size: 16px;
            background: var(--card-bg);
            padding: 20px 25px;
            border-radius: 10px;
            border-left: 4px solid var(--accent-gold);
            border-top: 1px solid var(--border-color);
            border-right: 1px solid var(--border-color);
            border-bottom: 1px solid var(--border-color);
            transition: background 0.3s ease;
        }

        /* CATEGORY FILTER TABS */
        .gallery-container {
            padding: 40px 8% 40px;
        }

        .category-filter-bar {
            display: flex;
            gap: 12px;
            margin-bottom: 35px;
            flex-wrap: wrap;
        }

        .filter-btn {
            background: var(--card-bg);
            color: var(--text-light);
            border: 1px solid var(--border-color);
            padding: 10px 20px;
            border-radius: 30px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .filter-btn:hover, .filter-btn.active {
            background: var(--accent-gold);
            color: #ffffff;
            border-color: var(--accent-gold);
            font-weight: 600;
        }

        /* MEDIA GRID */
        .section-heading {
            font-size: 20px;
            letter-spacing: 1px;
            margin-bottom: 20px;
            color: var(--accent-gold);
            text-transform: uppercase;
        }

        .media-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 50px;
        }

        .media-item-card {
            background: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--border-color);
            transition: transform 0.3s ease, box-shadow 0.3s ease, background 0.3s ease;
            position: relative;
            cursor: pointer;
        }

        .media-item-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
        }

        .media-item-card img, .media-item-card video {
            width: 100%;
            height: 240px;
            object-fit: cover;
            display: block;
        }

        .video-card-badge {
            position: absolute;
            top: 12px;
            right: 12px;
            background: rgba(0, 0, 0, 0.7);
            color: #fff;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 12px;
        }

        .empty-gallery-msg {
            color: var(--text-muted);
            text-align: center;
            padding: 50px;
            background: var(--card-bg);
            border-radius: 10px;
            grid-column: 1 / -1;
            border: 1px solid var(--border-color);
        }

        /* BUTTON STYLES */
        .back-home-btn {
            display: inline-block;
            background: linear-gradient(135deg, #f3e5ad 0%, #c5a059 50%, #9e7b32 100%);
            color: #121110 !important;
            font-weight: 600;
            padding: 8px 18px;
            border-radius: 4px;
            text-decoration: none;
            font-size: 13px;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(197, 160, 89, 0.2);
        }

        .back-home-btn:hover {
            background: #ffffff;
            color: #121110 !important;
            transform: translateX(-3px);
            box-shadow: 0 6px 20px rgba(255, 255, 255, 0.3);
        }

        /* BOTTOM BACK TO HOME BUTTON */
        .bottom-back-container {
            text-align: center;
            padding: 20px 20px 80px;
            background: var(--bg-dark);
            transition: background 0.3s ease;
        }

        .bottom-back-btn {
            display: inline-block;
            padding: 14px 32px;
            background: linear-gradient(135deg, #f3e5ad 0%, #c5a059 50%, #9e7b32 100%);
            color: #121110 !important;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
            text-decoration: none;
            border-radius: 4px;
            transition: all 0.3s ease;
            box-shadow: 0 10px 25px rgba(197, 160, 89, 0.2);
        }

        .bottom-back-btn:hover {
            background: #ffffff;
            color: #121110 !important;
            transform: translateY(-3px);
            box-shadow: 0 15px 30px rgba(255, 255, 255, 0.3);
        }

        @media (max-width: 768px) {
            .event-title-main { font-size: 30px; }
            .media-grid { grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); }
        }
    </style>
</head>
<body>

    <!-- NAVIGATION WITH BACK & THEME TOGGLE BUTTON -->
    <nav class="event-nav">
        <a href="../index.html" class="brand-logo">PRIME-D</a>
        
        <div class="nav-actions">
            <!-- THEME SWITCHER BUTTON -->
            <button class="theme-toggle-btn" id="themeToggleBtn">
                <span id="themeIcon">☀️</span> <span id="themeText">Light</span>
            </button>
            <a href="../index.html" class="back-home-btn">← Back to Home</a>
        </div>
    </nav>

    <header class="event-hero">
        <div class="event-tag">PRIME-D EXCLUSIVE EVENT</div>
        <h1 class="event-title-main" id="eventTitle">Loading Event...</h1>
        
        <div class="event-meta-info">
            <span id="eventDate">📅 Date...</span>
            <span id="eventLocation">📍 Location...</span>
            <span id="eventBudget" style="display: none;">💰 Budget...</span>
        </div>

        <div class="event-description-box" id="eventDescription">
            Loading event story details...
        </div>
    </header>

    <main class="gallery-container">
        <!-- CATEGORIES -->
        <div class="category-filter-bar" id="categoryFilterBar">
            <button class="filter-btn active" data-category="all">All Media</button>
        </div>

        <!-- PHOTOS GRID -->
        <h2 class="section-heading">📷 Moments & Photos</h2>
        <div class="media-grid" id="photosGrid">
            <div class="empty-gallery-msg">Loading photos...</div>
        </div>

        <!-- VIDEOS GRID -->
        <h2 class="section-heading">🎥 Film & Videos</h2>
        <div class="media-grid" id="videosGrid">
            <div class="empty-gallery-msg">Loading videos...</div>
        </div>
    </main>

    <!-- BOTTOM BACK TO HOME BUTTON -->
    <div class="bottom-back-container">
        <a href="../index.html" class="bottom-back-btn">
            ← Back to All Events
        </a>
    </div>

    <!-- RELIABLE THEME TOGGLE SCRIPT -->
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const themeBtn = document.getElementById("themeToggleBtn");
            const themeIcon = document.getElementById("themeIcon");
            const themeText = document.getElementById("themeText");

            // Previous Theme Preference Setup
            const savedTheme = localStorage.getItem("primed_theme");
            if (savedTheme === "light") {
                document.body.classList.add("light-theme");
                if (themeIcon) themeIcon.textContent = "🌙";
                if (themeText) themeText.textContent = "Dark";
            }

            themeBtn?.addEventListener("click", () => {
                document.body.classList.toggle("light-theme");
                const isLight = document.body.classList.contains("light-theme");

                if (isLight) {
                    if (themeIcon) themeIcon.textContent = "🌙";
                    if (themeText) themeText.textContent = "Dark";
                    localStorage.setItem("primed_theme", "light");
                } else {
                    if (themeIcon) themeIcon.textContent = "☀️";
                    if (themeText) themeText.textContent = "Light";
                    localStorage.setItem("primed_theme", "dark");
                }
            });
        });
    </script>

    <script type="module" src="../js/event.js"></script>
</body>
</html>
