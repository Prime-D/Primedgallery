<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Details | Prime-D</title>
    <link rel="stylesheet" href="../css/style.css">
    <style>
        :root {
            --bg-dark: #121212;
            --card-bg: #1e1e1e;
            --accent-gold: #c5a059;
            --text-light: #f5f5f5;
            --text-muted: #a0a0a0;
            --border-color: #2a2a2a;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
        }

        /* HEADER & NAVIGATION */
        .event-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 8%;
            background: rgba(18, 18, 18, 0.95);
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .brand-logo {
            font-size: 22px;
            font-weight: 700;
            letter-spacing: 2px;
            color: var(--accent-gold);
            text-decoration: none;
        }

        .nav-links a {
            color: var(--text-light);
            text-decoration: none;
            margin-left: 25px;
            font-size: 14px;
            letter-spacing: 1px;
            transition: color 0.3s;
        }

        .nav-links a:hover {
            color: var(--accent-gold);
        }

        /* HERO / HEADER SECTION */
        .event-hero {
            padding: 60px 8% 40px;
            background: linear-gradient(180deg, #181818 0%, var(--bg-dark) 100%);
            border-bottom: 1px solid var(--border-color);
        }

        .event-tag {
            color: var(--accent-gold);
            font-size: 12px;
            letter-spacing: 3px;
            text-transform: uppercase;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .event-title-main {
            font-size: 42px;
            font-weight: 700;
            margin: 0 0 15px 0;
            line-height: 1.2;
        }

        .event-meta-info {
            display: flex;
            gap: 25px;
            color: var(--text-muted);
            font-size: 15px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }

        .event-description-box {
            max-width: 800px;
            line-height: 1.7;
            color: #d1d1d1;
            font-size: 16px;
            background: var(--card-bg);
            padding: 20px 25px;
            border-radius: 10px;
            border-left: 4px solid var(--accent-gold);
        }

        /* CATEGORY FILTER TABS */
        .gallery-container {
            padding: 40px 8% 80px;
        }

        .category-filter-bar {
            display: flex;
            gap: 12px;
            margin-bottom: 35px;
            flex-wrap: wrap;
        }

        .filter-btn {
            background: var(--card-bg);
            color: var(--text-light);
            border: 1px solid var(--border-color);
            padding: 10px 20px;
            border-radius: 30px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .filter-btn:hover, .filter-btn.active {
            background: var(--accent-gold);
            color: #000;
            border-color: var(--accent-gold);
            font-weight: 600;
        }

        /* MEDIA GRID */
        .section-heading {
            font-size: 20px;
            letter-spacing: 1px;
            margin-bottom: 20px;
            color: var(--accent-gold);
            text-transform: uppercase;
        }

        .media-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 50px;
        }

        .media-item-card {
            background: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--border-color);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            position: relative;
            cursor: pointer;
        }

        .media-item-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
        }

        .media-item-card img, .media-item-card video {
            width: 100%;
            height: 240px;
            object-fit: cover;
            display: block;
        }

        .video-card-badge {
            position: absolute;
            top: 12px;
            right: 12px;
            background: rgba(0, 0, 0, 0.7);
            color: #fff;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 12px;
        }

        .empty-gallery-msg {
            color: var(--text-muted);
            text-align: center;
            padding: 50px;
            background: var(--card-bg);
            border-radius: 10px;
            grid-column: 1 / -1;
        }

        @media (max-width: 768px) {
            .event-title-main { font-size: 30px; }
            .media-grid { grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); }
        }
    </style>
</head>
<body>

    <nav class="event-nav">
        <a href="../index.html" class="brand-logo">PRIME-D</a>
        <div class="nav-links">
            <a href="../index.html">HOME</a>
            <a href="../index.html#events">EVENTS</a>
        </div>
    </nav>

    <header class="event-hero">
        <div class="event-tag">PRIME-D EXCLUSIVE EVENT</div>
        <h1 class="event-title-main" id="eventTitle">Loading Event...</h1>
        
        <div class="event-meta-info">
            <span id="eventDate">📅 Date...</span>
            <span id="eventLocation">📍 Location...</span>
            <span id="eventBudget" style="display: none;">💰 Budget...</span>
        </div>

        <div class="event-description-box" id="eventDescription">
            Loading event story details...
        </div>
    </header>

    <main class="gallery-container">
        <!-- CATEGORIES -->
        <div class="category-filter-bar" id="categoryFilterBar">
            <button class="filter-btn active" data-category="all">All Media</button>
        </div>

        <!-- PHOTOS GRID -->
        <h2 class="section-heading">📷 Moments & Photos</h2>
        <div class="media-grid" id="photosGrid">
            <div class="empty-gallery-msg">Loading photos...</div>
        </div>

        <!-- VIDEOS GRID -->
        <h2 class="section-heading">🎥 Film & Videos</h2>
        <div class="media-grid" id="videosGrid">
            <div class="empty-gallery-msg">Loading videos...</div>
        </div>
    </main>

    <script type="module" src="../js/event.js"></script>
</body>
</html>
