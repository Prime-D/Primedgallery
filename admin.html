<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prime-D Admin Dashboard</title>
    <link rel="stylesheet" href="../css/style.css">
    <style>
        body { background: #f5f5f5; color: #222; }
        .admin-container { max-width: 1100px; margin: auto; padding: 30px 20px 80px; }
        .admin-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        .admin-section { background: #fff; padding: 25px; margin-bottom: 25px; border-radius: 14px; box-shadow: 0 4px 18px rgba(0,0,0,0.08); }
        .form-group { margin-bottom: 18px; }
        .form-group label { display: block; margin-bottom: 7px; font-weight: 600; }
        input, textarea, select { width: 100%; padding: 11px 12px; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; font-size: 15px; }
        textarea { min-height: 120px; resize: vertical; }
        button { padding: 11px 18px; border: none; border-radius: 8px; cursor: pointer; font-size: 15px; }
        .primary-button { background: #111; color: #fff; }
        .secondary-button { background: #e8e8e8; color: #222; }
        .danger-button { background: #d32f2f; color: #fff; }
        .message { margin-top: 12px; padding: 8px 0; }
        .media-upload-grid { display: grid; grid-template-columns: 1fr; gap: 20px; }
        .media-box { padding: 18px; border: 1px solid #ddd; border-radius: 10px; background: #fafafa; }
        .category-list { margin-top: 15px; }
        .category-item { display: flex; justify-content: space-between; align-items: center; padding: 12px; border-bottom: 1px solid #eee; }
        .category-media-admin-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 18px; margin-top: 20px; }
        .admin-media-card { background: #fafafa; border: 1px solid #ddd; border-radius: 12px; overflow: hidden; }
        .admin-media-card img, .admin-media-card video { width: 100%; height: 180px; object-fit: cover; display: block; }
    </style>
</head>
<body>

<main class="admin-container">
    <div class="admin-header">
        <h1>Prime-D Admin Dashboard</h1>
        <button type="button" id="logoutBtn" class="secondary-button">Logout</button>
    </div>

    <!-- CREATE EVENT -->
    <section class="admin-section">
        <h2>Create New Event</h2>
        <form id="eventForm">
            <div class="form-group">
                <label for="eventName">Event Name</label>
                <input type="text" id="eventName" required>
            </div>
            <div class="form-group">
                <label for="eventDate">Event Date</label>
                <input type="date" id="eventDate" required>
            </div>
            <div class="form-group">
                <label for="location">Location</label>
                <input type="text" id="location" required>
            </div>
            <div class="form-group">
                <label for="description">Description</label>
                <textarea id="description"></textarea>
            </div>
            <div class="form-group">
                <label for="budget">Budget</label>
                <input type="number" id="budget" min="0">
            </div>
            <div class="form-group">
                <label><input type="checkbox" id="showBudget"> Show Budget to Public</label>
            </div>
            <button type="submit" class="primary-button">Create Event</button>
            <div id="message" class="message"></div>
        </form>
    </section>

    <!-- SELECT EVENT -->
    <section class="admin-section">
        <h2>Select Event</h2>
        <div class="form-group">
            <label for="eventSelect">Event</label>
            <select id="eventSelect">
                <option value="">-- Select Event --</option>
            </select>
        </div>
    </section>

    <!-- MANAGE CATEGORIES -->
    <section class="admin-section">
        <h2>Manage Categories</h2>
        <div class="form-group">
            <label for="categoryName">Category Name</label>
            <input type="text" id="categoryName" placeholder="Example: Wedding Ceremony">
        </div>
        <button type="button" id="addCategoryBtn" class="primary-button">+ Add Category</button>
        <div id="categoryMessage" class="message"></div>
        <div id="categoryList" class="category-list"></div>
    </section>

    <!-- UPLOAD MEDIA -->
    <section class="admin-section">
        <h2>Upload Category Media</h2>
        <div class="form-group">
            <label for="categorySelect">Select Category</label>
            <select id="categorySelect">
                <option value="">-- Select Category --</option>
            </select>
        </div>
        <div class="media-upload-grid">
            <div class="media-box">
                <label for="categoryMediaInput">Select Files (Photos & Videos)</label>
                <input type="file" id="categoryMediaInput" multiple accept="image/*,video/*">
            </div>
        </div>
        <br>
        <button type="button" id="uploadCategoryMediaBtn" class="primary-button">Upload Media</button>
        <div id="categoryUploadMessage" class="message"></div>
    </section>

    <!-- MANAGE MEDIA -->
    <section class="admin-section">
        <h2>Manage Category Media</h2>
        <div id="categoryMediaMessage" class="message"></div>
        <div id="categoryMediaList" class="category-media-admin-list"></div>
    </section>
</main>

<script type="module" src="../js/admin.js"></script>
</body>
</html>
