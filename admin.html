<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Prime-D Admin Dashboard</title>

    <link
        rel="stylesheet"
        href="../css/style.css"
    >

    <style>

        body {
            background: #f5f5f5;
            color: #222;
        }

        .admin-container {
            max-width: 1100px;
            margin: auto;
            padding: 30px 20px 80px;
        }

        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .admin-section {
            background: #fff;
            padding: 25px;
            margin-bottom: 25px;
            border-radius: 14px;
            box-shadow: 0 4px 18px rgba(0,0,0,0.08);
        }

        .admin-section h2 {
            margin-top: 0;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            margin-bottom: 7px;
            font-weight: 600;
        }

        input,
        textarea,
        select {
            width: 100%;
            padding: 11px 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 15px;
        }

        textarea {
            min-height: 120px;
            resize: vertical;
        }

        button {
            padding: 11px 18px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
        }

        .primary-button {
            background: #111;
            color: #fff;
        }

        .secondary-button {
            background: #e8e8e8;
            color: #222;
        }

        .danger-button {
            background: #d32f2f;
            color: #fff;
        }

        .message {
            margin-top: 12px;
            padding: 8px 0;
        }

        .media-upload-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .media-box {
            padding: 18px;
            border: 1px solid #ddd;
            border-radius: 10px;
            background: #fafafa;
        }

        .media-box label {
            display: block;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .category-list {
            margin-top: 15px;
        }

        .category-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            padding: 12px;
            border-bottom: 1px solid #eee;
        }

        .delete-category-btn,
        .delete-media-btn {
            background: #d32f2f;
            color: #fff;
        }

        .delete-category-btn:hover,
        .delete-media-btn:hover {
            background: #b71c1c;
        }
.danger-button {
    background: #d32f2f;
    color: #fff;
}

.danger-button:hover {
    background: #b71c1c;
}
        /* ========================================
           ADMIN MEDIA LIST
        ======================================== */

        .category-media-admin-list {
            display: grid;
            grid-template-columns:
                repeat(auto-fill, minmax(220px, 1fr));
            gap: 18px;
            margin-top: 20px;
        }

        .admin-media-card {
            background: #fafafa;
            border: 1px solid #ddd;
            border-radius: 12px;
            overflow: hidden;
        }

        .admin-media-card img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            display: block;
        }

        .admin-media-card video {
            width: 100%;
            height: 180px;
            object-fit: contain;
            background: #000;
            display: block;
        }

        .admin-media-info {
            padding: 12px;
        }

        .delete-media-btn {
            width: 100%;
            margin-top: 10px;
        }

        .no-media {
            text-align: center;
            padding: 30px;
            color: #777;
            grid-column: 1 / -1;
        }

        @media (max-width: 700px) {

            .media-upload-grid {
                grid-template-columns: 1fr;
            }

            .admin-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 15px;
            }

            .category-item {
                flex-direction: column;
                align-items: flex-start;
            }

        }

    </style>

</head>


<body>

<main class="admin-container">


    <!-- ========================================
         HEADER
    ======================================== -->

    <div class="admin-header">

        <h1>
            Prime-D Admin Dashboard
        </h1>

        <button
            type="button"
            id="logoutBtn"
            class="secondary-button"
        >
            Logout
        </button>

    </div>


    <!-- ========================================
         CREATE EVENT
    ======================================== -->

    <section class="admin-section">

        <h2>
            Create New Event
        </h2>

        <form id="eventForm">

            <div class="form-group">

                <label for="eventName">
                    Event Name
                </label>

                <input
                    type="text"
                    id="eventName"
                    required
                >

            </div>


            <div class="form-group">

                <label for="eventDate">
                    Event Date
                </label>

                <input
                    type="date"
                    id="eventDate"
                    required
                >

            </div>


            <div class="form-group">

                <label for="location">
                    Location
                </label>

                <input
                    type="text"
                    id="location"
                    required
                >

            </div>


            <div class="form-group">

                <label for="description">
                    Description
                </label>

                <textarea
                    id="description"
                ></textarea>

            </div>


            <div class="form-group">

                <label for="budget">
                    Budget
                </label>

                <input
                    type="number"
                    id="budget"
                    min="0"
                >

            </div>


            <div class="form-group">

                <label>

                    <input
                        type="checkbox"
                        id="showBudget"
                    >

                    Show Budget to Public

                </label>

            </div>


            <button
                type="submit"
                class="primary-button"
            >
                Create Event
            </button>


            <div
                id="message"
                class="message"
            ></div>


            <div
                id="uploadMessage"
                class="message"
            ></div>

        </form>

    </section>
<!-- ========================================
     EVENT MANAGEMENT
======================================== -->

<section class="admin-section">

    <h2>Manage Selected Event</h2>

    <div id="eventManagementMessage" class="message"></div>

    <div id="eventManagementPanel" style="display:none;">

        <div class="form-group">

            <label for="editEventName">
                Event Name
            </label>

            <input
                type="text"
                id="editEventName"
            >

        </div>

        <div class="form-group">

            <label for="editEventDate">
                Event Date
            </label>

            <input
                type="date"
                id="editEventDate"
            >

        </div>

        <div class="form-group">

            <label for="editLocation">
                Location
            </label>

            <input
                type="text"
                id="editLocation"
            >

        </div>

        <div class="form-group">

            <label for="editDescription">
                Description
            </label>

            <textarea
                id="editDescription"
            ></textarea>

        </div>

        <div class="form-group">

            <label for="editBudget">
                Budget
            </label>

            <input
                type="number"
                id="editBudget"
                min="0"
            >

        </div>

        <div class="form-group">

            <label>

                <input
                    type="checkbox"
                    id="editShowBudget"
                >

                Show Budget to Public

            </label>

        </div>

        <div
            style="
                display:flex;
                flex-wrap:wrap;
                gap:10px;
                margin-top:15px;
            "
        >

            <button
                type="button"
                id="saveEventBtn"
                class="primary-button"
            >
                💾 Save Changes
            </button>

            <button
                type="button"
                id="cancelEditBtn"
                class="secondary-button"
            >
                Cancel
            </button>

            <button
                type="button"
                id="publishEventBtn"
                class="primary-button"
            >
                🟢 Publish
            </button>

            <button
                type="button"
                id="unpublishEventBtn"
                class="secondary-button"
            >
                🔴 Unpublish
            </button>

            <button
                type="button"
                id="deleteEventBtn"
                class="danger-button"
            >
                🗑️ Delete Event
            </button>

        </div>

        <div
            id="eventStatus"
            class="message"
        ></div>

    </div>

</section>

    <!-- ========================================
         SELECT EVENT
    ======================================== -->

    <section class="admin-section">

        <h2>
            Select Event
        </h2>

        <div class="form-group">

            <label for="eventSelect">
                Event
            </label>

            <select id="eventSelect">

                <option value="">
                    -- Select Event --
                </option>

            </select>

        </div>

    </section>


    <!-- ========================================
         CATEGORY MANAGEMENT
    ======================================== -->

    <section class="admin-section">

        <h2>
            Manage Categories
        </h2>


        <div class="form-group">

            <label for="categoryName">
                Category Name
            </label>

            <input
                type="text"
                id="categoryName"
                placeholder="Example: Wedding Ceremony"
            >

        </div>


        <button
            type="button"
            id="addCategoryBtn"
            class="primary-button"
        >
            + Add Category
        </button>


        <div
            id="categoryMessage"
            class="message"
        ></div>


        <div
            id="categoryList"
            class="category-list"
        ></div>

    </section>


    <!-- ========================================
         CATEGORY MEDIA UPLOAD
    ======================================== -->

    <section class="admin-section">

        <h2>
            Upload Category Media
        </h2>


        <div class="form-group">

            <label for="categorySelect">
                Select Category
            </label>

            <select id="categorySelect">

                <option value="">
                    -- Select Category --
                </option>

            </select>

        </div>


        <div class="media-upload-grid">


            <!-- PHOTOS -->

            <div class="media-box">

                <label for="categoryPhotos">
                    Photos
                </label>

                <input
                    type="file"
                    id="categoryPhotos"
                    accept="image/*"
                    multiple
                >

                <small>
                    You can select multiple photos.
                </small>

            </div>


            <!-- VIDEOS -->

            <div class="media-box">

                <label for="categoryVideos">
                    Videos
                </label>

                <input
                    type="file"
                    id="categoryVideos"
                    accept="video/*"
                    multiple
                >

                <small>
                    You can select multiple videos.
                </small>

            </div>

        </div>


        <br>


        <button
            type="button"
            id="uploadCategoryMediaBtn"
            class="primary-button"
        >
            Upload Media
        </button>


        <div
            id="categoryUploadMessage"
            class="message"
        ></div>

    </section>


    <!-- ========================================
         MANAGE CATEGORY MEDIA
    ======================================== -->

    <section class="admin-section">

        <h2>
            Manage Category Media
        </h2>

        <p>
            Select a category above to view and manage
            uploaded photos and videos.
        </p>


        <div
            id="categoryMediaMessage"
            class="message"
        ></div>


        <h3>
            Uploaded Media
        </h3>


        <div
            id="categoryMediaList"
            class="category-media-admin-list"
        ></div>

    </section>


</main>


<!-- ========================================
     JAVASCRIPT
======================================== -->

<script
    type="module"
    src="../js/admin.js"
></script>


</body>

</html>
